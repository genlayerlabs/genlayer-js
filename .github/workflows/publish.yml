name: Publish Package to NPM

# Tag-driven publish. Releases are cut by a human (or Claude via the
# release skill) with scripts/release.sh. The release commit (package.json,
# CHANGELOG.md) is always made on the v<MAJOR>-dev branch: an RC is tagged
# there, a final is tagged by `release.sh --promote` after the stable
# branch was fast-forwarded to that commit. This workflow fires on the
# tag push, sanity-checks that the tag matches package.json and that a
# final tag is on its stable branch, builds, and publishes to npm. It
# never bumps or tags by itself.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Publish
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          # Full history: a final tag is checked against its stable branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Verify tag and resolve npm dist-tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "Publish must run from a git tag. Current ref type: ${GITHUB_REF_TYPE:-unknown}" >&2
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          node scripts/resolve-release-channel.mjs "$TAG_VERSION" "$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag $GITHUB_REF_NAME matches package.json $PKG_VERSION."

          # A final is only published from its stable branch.
          if [ "$(node scripts/release-policy.mjs is-prerelease "$TAG_VERSION")" = "false" ]; then
            STABLE="$(node scripts/release-policy.mjs stable-branch "$TAG_VERSION")"
            git fetch --no-tags origin "+refs/heads/$STABLE:refs/remotes/origin/$STABLE"
            if ! git merge-base --is-ancestor HEAD "origin/$STABLE"; then
              echo "Tag $GITHUB_REF_NAME is not on $STABLE. Finals are tagged by 'scripts/release.sh --promote', after $STABLE moved to the release commit." >&2
              exit 1
            fi
            echo "Tag $GITHUB_REF_NAME is on $STABLE."
          fi

      - run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ steps.version.outputs.npm_dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pull the changelog block for this version out of CHANGELOG.md.
          # Falls back to a generic body if the section isn't found.
          NOTES="$(awk -v ver="$GITHUB_REF_NAME" '
            $0 ~ "^## \\[?" substr(ver, 2) {capture=1; next}
            capture && /^## / {exit}
            capture {print}
          ' CHANGELOG.md)"
          if [ -z "$NOTES" ]; then
            NOTES="Release $GITHUB_REF_NAME"
          fi

          NOTES="$NOTES

          npm install genlayer-js@${{ steps.version.outputs.npm_dist_tag }}"

          RELEASE_FLAGS=()
          if [ "${{ steps.version.outputs.is_prerelease }}" = "true" ]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTES" \
            "${RELEASE_FLAGS[@]}"

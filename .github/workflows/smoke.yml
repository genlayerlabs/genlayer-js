name: Smoke Tests

on:
  pull_request:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  smoke:
    name: Testnet Smoke Tests
    # The v2 line intentionally targets the resolution-kernel train and does
    # not support the currently deployed pre-train testnets. Its live coverage
    # comes from the cross-repository E2E stack until those testnets upgrade.
    if: github.event_name != 'pull_request' || github.base_ref != 'v2-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run smoke tests
        run: npm run test:smoke

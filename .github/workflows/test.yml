name: Run Tests

on:
  push:
    branches:
      - v1
      - v2-dev
      - v2
  pull_request:
    branches:
      - v1
      - v2-dev
      - v2

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        timeout-minutes: 5

      - name: Run linting
        run: npm run lint
